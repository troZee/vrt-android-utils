name: Android emulator

on:
  workflow_dispatch:
  pull_request:

jobs:
  emulator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install JavaScript dependencies
        run: bun install --frozen-lockfile

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Cache the exact SDK and AVD
        uses: actions/cache@v4
        with:
          path: .android-sdk
          key: android-emulator-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('emulator.config.json') }}

      - name: Validate shared configuration
        run: bun run validate

      # Replace this smoke check with the repository's instrumented-test command.
      - name: Run on the shared emulator
        run: ./bin/vrt-emulator run -- adb shell getprop ro.build.version.sdk
