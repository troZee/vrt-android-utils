name: Android emulator and AnyAPK

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

concurrency:
  group: android-emulator-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ANYAPK_VERSION: 0.0.15
  ANYAPK_PATH: .cache/apks/anyapk-0.0.15-universal.apk
  ANYAPK_URL: https://github.com/sam1am/anyapk/releases/download/v0.0.15/anyapk-0.0.15-universal.apk

jobs:
  install-anyapk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install JavaScript dependencies
        run: bun install --frozen-lockfile

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install host tools
        run: |
          missing=0
          command -v curl >/dev/null || missing=1
          command -v unzip >/dev/null || missing=1
          if [ "$missing" -eq 1 ]; then
            sudo apt-get update
            sudo apt-get install --yes curl unzip
          fi

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Cache the exact SDK and AVD
        uses: actions/cache@v4
        with:
          path: .android-sdk
          key: android-emulator-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('emulator.config.json', 'emulator.config.schema.json') }}

      - name: Cache AnyAPK
        id: anyapk-cache
        uses: actions/cache@v4
        with:
          path: .cache/apks
          key: anyapk-${{ env.ANYAPK_VERSION }}-universal

      - name: Download AnyAPK
        if: steps.anyapk-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$(dirname "$ANYAPK_PATH")"
          curl --fail --location --retry 3 --output "$ANYAPK_PATH.part" "$ANYAPK_URL"
          mv "$ANYAPK_PATH.part" "$ANYAPK_PATH"

      - name: Validate shared configuration
        run: bun run validate

      - name: Boot configured emulator and install AnyAPK
        run: ./src/cli.mjs run -- ./scripts/install-apk-and-wait.sh "$ANYAPK_PATH"
